version: '3.8'

services:
  # 主应用服务 - 轻量级版本 (SQLite + 内存缓存)
  #
  # DEVELOPMENT / LOCAL USE ONLY.
  # This file must not replace the production container. Production is started
  # by /home/ubuntu/.local/share/api-key-rotator/run-rotator.sh, which binds to
  # 127.0.0.1:8020 and uses the real data directory and secrets.
  app:
    build:
      context: .
      dockerfile: Dockerfile  # 使用默认轻量级构建
    # Avoid clobbering the production container named "api-key-rotator".
    container_name: api-key-rotator-dev
    ports:
      # Loopback only. Never expose this dev instance directly to the network.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      # 必需的安全配置. Fail the compose command instead of silently falling
      # back to the weak defaults when these are missing.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - GLOBAL_PROXY_KEYS=${GLOBAL_PROXY_KEYS:?GLOBAL_PROXY_KEYS is required}

      # 轻量级服务配置
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - PROXY_PUBLIC_BASE_URL=${PROXY_PUBLIC_BASE_URL:-http://localhost:8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RESET_DB_TABLES=${RESET_DB_TABLES:-false}

      # SQLite配置 (轻量级默认)
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/api_key_rotator.db}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - api-key-rotator-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  api-key-rotator-network:
    driver: bridge