name: Deploy Worker

# Auto-deploy the Cloudflare Worker on push.
#
# The Workers Builds API requires the `workers-ci.write` permission, which the
# repository's CLOUDFLARE_API_TOKEN does not have. This workflow deploys with
# the same account token via Wrangler instead, so pushes to master still ship
# automatically. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo
# secrets (already configured).

on:
  push:
    branches: [master]
    paths:
      - 'cloudflare/**'
      - 'frontend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build admin UI
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install

      - name: Apply D1 migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy